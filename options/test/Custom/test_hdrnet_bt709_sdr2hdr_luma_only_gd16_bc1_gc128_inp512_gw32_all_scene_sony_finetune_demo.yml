# 基于 train_hdrnet_bt709_sdr2hdr_luma_only_gd16_bc1_gc128_inp512_gw32_all_scene_sony_finetune.yml 生成的测试配置
# 测试输入: /mnt/data/wcm/data/hdr/test/demo/input（01_/02_ 前缀, 8bit BT.709 SDR, 共 1000 张）
# checkpoint: finetune 实验最新 (net_g_135000.pth)
name: test_hdrnet_bt709_sdr2hdr_luma_only_gd16_bc1_gc128_inp512_gw32_all_scene_sony_finetune_demo
model_type: SRModel
scale: 1
num_gpu: 0
manual_seed: 1234
dist: false

datasets:
  test_1:
    name: SDR2HDR_Demo
    type: SingleImageDataset
    dataroot_lq: /mnt/data/wcm/data/hdr/test/demo/input
    io_backend:
      type: disk

network_g:
  type: HDRnetBT709PaperLumaOnly
  num_in_ch: 3
  num_out_ch: 3
  grid_H: 32
  grid_W: 32
  grid_D: 16
  base_channels: 1
  fixed_ds_size: 512
  global_channels: 128

path:
  pretrain_network_g: /mnt/data/wcm/HDRNet/experiments/train_hdrnet_bt709_sdr2hdr_luma_only_gd16_bc1_gc128_inp512_gw32_all_scene_sony_finetune/models/net_g_135000.pth
  strict_load_g: true

val:
  save_img: true
  pbar: true
  suffix: ''

  metrics: {}
