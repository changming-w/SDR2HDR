# GENERATE TIME: Thu Sep 17 14:25:49 2026
# CMD:
# basicsr/train.py -opt /mnt/data/wcm/HDRNet/options/train/Custom/train_hdrnet_bt709_sdr2hdr_sony.yml --auto_resume

# 10.12M
name: train_hdrnet_bt709_sdr2hdr_sony_xr70
model_type: SRModel
scale: 1
num_gpu: 1
manual_seed: 1234

datasets:
  train:
    name: SDR2HDR_Train
    type: PairedImageDataset
    dataroot_gt: /mnt/data/wcm/data/hdr/train/sony_xr70/gt_sony
    dataroot_lq: /mnt/data/wcm/data/hdr/train/sony_xr70/lq_ori
    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 738
    use_hflip: true
    use_rot: true

    batch_size_per_gpu: 48
    num_worker_per_gpu: 16
    dataset_enlarge_ratio: 1
    load_to_memory: false

  val:
    name: SDR2HDR_Val
    type: PairedImageDataset
    dataroot_gt: /mnt/data/wcm/data/hdr/train/sony_xr70/val_gt
    dataroot_lq: /mnt/data/wcm/data/hdr/train/sony_xr70/val_lq
    io_backend:
      type: disk

network_g:
  type: HDRnetBT709Paper
  num_in_ch: 3
  num_out_ch: 3
  grid_H: 32
  grid_W: 32
  grid_D: 16
  base_channels: 4
  fixed_ds_size: 512
  global_channels: 256

train:
  ema: false
  ema_decay: 0.999

  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: !!float 1e-6
    betas: [0.9, 0.999]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [1000000]
    restart_weights: [1.0]
    eta_min: !!float 1e-6

  total_iter: 1000000
  warmup_iter: -1

  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

val:
  val_freq: 5000
  save_img: true

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

logger:
  print_freq: 100
  save_checkpoint_freq: 5000
  use_tb_logger: true
  tb_logger_freq: 100

path:
  root: ./experiments
  pretrain_network_g: ~
  strict_load: true
  resume_state: ~

dist_params:
  backend: nccl
  port: 29500
