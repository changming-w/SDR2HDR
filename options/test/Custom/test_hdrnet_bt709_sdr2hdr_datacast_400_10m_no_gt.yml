name: test_hdrnet_bt709_sdr2hdr_datacast_400_10m_no_gt_ori_apply_ori
model_type: SRModel
scale: 1  
num_gpu: 0
manual_seed: 12

datasets:
  val:
    name: SDR2HDR_Test_NoGT
    type: SingleImageDataset
    dataroot_lq: /mnt/data/wcm/data/hdr/train/Q10M采集400张/lq_ori_1080p
    filename_tmpl: '{}'
    io_backend:
      type: disk

network_g:
  type: HDRnetBT709Paper
  num_in_ch: 3
  num_out_ch: 3
  grid_H: 32
  grid_W: 32
  grid_D: 16
  base_channels: 4
  fixed_ds_size: 512
  global_channels: 256

val:
  val_freq: 1
  suffix: ~
  save_img: true

logger:
  print_freq: 1
  save_checkpoint_freq: 999999
  use_tb_logger: false
  tb_logger_freq: 100

path:
  root: ./experiments
  pretrain_network_g: /mnt/data/wcm/HDRNet/experiments/train_hdrnet_bt709_sdr2hdr_datacast_400_10m_orisdr/models/net_g_75000.pth
  strict_load: true
  resume_state: ~

dist_params:
  backend: nccl
  port: 29500
