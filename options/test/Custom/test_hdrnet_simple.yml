name: train_hdrnet_simple
model_type: SRModel
scale: 1
num_gpu: 1
manual_seed: 1234
dist: false

datasets:
  test_1:
    name: HDRTestSet
    type: SingleImageDataset
    dataroot_lq: /mnt/data/wcm/HDRNet/test_1080p
    io_backend:
      type: disk

network_g:
  type: HDRnetSimple
  num_in_ch: 3
  num_out_ch: 3
  grid_H: 20
  grid_W: 36
  grid_D: 16
  base_channels: 16
  num_downsample: 3
  num_residual: 2
  grid_input_H: 216
  grid_input_W: 384
  guide_input_H: 216
  guide_input_W: 384

inference:
  hdrnet_strength: 1.0

path:
  pretrain_network_g: /mnt/data/wcm/HDRNet/experiments/train_hdrnet_simple/models/net_g_5000.pth
  strict_load_g: false

val:
  save_img: true
  pbar: true
  suffix: ''

  metrics: {}
