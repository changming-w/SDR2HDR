# CMD:
# basicsr/train.py -opt /mnt/data/wcm/HDRNet/options/train/Custom/train_hdrnet_zhuti_tiliang.yml

name: train_hdrnet_zhuti_tiliang
model_type: SRModel
scale: 1
num_gpu: 1
manual_seed: 1234

datasets:
  train:
    name: HDRTrainSet
    type: PairedImageDataset
    dataroot_gt: /mnt/data/datasets/HDR/train_set/gt/gt_subject_enhanced_dpt_0.3_1.12
    dataroot_lq: /mnt/data/datasets/HDR/train_set/train_sdr_lq_light
    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 512
    use_hflip: false
    use_rot: false

    batch_size_per_gpu: 24
    num_worker_per_gpu: 8
    dataset_enlarge_ratio: 1
    prefetch_mode: ~   # 先关掉，确认版本后可改 'cpu' 并加 num_prefetch_queue

  val:
    name: HDRValSet
    type: PairedImageDataset
    dataroot_gt: /mnt/data/datasets/HDR/test_set/test_sdr_gt/test_sdr_gt.lmdb
    dataroot_lq: /mnt/data/datasets/HDR/test_set/test_sdr_lq/test_sdr_lq.lmdb
    io_backend:
      type: lmdb

network_g:
  type: HDRnet
  num_in_ch: 3
  num_out_ch: 3
  grid_H: 16
  grid_W: 16
  grid_D: 8
  base_channels: 16
  num_downsample: 3
  num_residual: 2

train:
  ema: false
  ema_decay: 0.999

  optim_g:
    type: AdamW
    lr: !!float 1e-3
    weight_decay: !!float 1e-6
    betas: [0.9, 0.999]

  # 学习率调度器（保留原有）
  scheduler:
    type: CosineAnnealingRestartLR
    periods: [100000]  # 学习率周期
    restart_weights: [1.0]  # 重启权重
    eta_min: !!float 1e-6  # 最小学习率

  # 训练迭代参数（保留原有）
  total_iter: 100000  # 总迭代次数
  warmup_iter: -1  # 不启用热身学习率

  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

val:
  val_freq: 5000
  save_img: true

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

logger:
  print_freq: 100
  save_checkpoint_freq: 5000
  use_tb_logger: true
  tb_logger_freq: 100
  # 如果暂时不用 wandb，可以注释掉下面
  # wandb:
  #   project: 'hdrnet'
  #   resume_id: ~

path:
  root: ./experiments
  pretrain_network_g: /mnt/data/wcm/HDRNet/experiments/train_hdrnet_zhuti_tiliang/models/net_g_15000.pth
  strict_load: true
  resume_state: /mnt/data/wcm/HDRNet/experiments/train_hdrnet_zhuti_tiliang/training_states/15000.state

dist_params:
  backend: nccl
  port: 29500