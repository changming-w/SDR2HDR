# basicsr/train.py -opt /mnt/data/wcm/HDRNet/options/train/Custom/train_hdrnet_bt709_sdr2hdr_v3.yml --auto_resume

name: train_hdrnet_bt709_sdr2hdr_v3
model_type: SRModel
scale: 1
num_gpu: 1
manual_seed: 1234

datasets:
  train:
    name: SDR2HDR_Train
    type: HDRPairedMultiDataset
    dataroot_gt:
      - /mnt/data/wcm/data/hdr/train/hdrframes_1080p
      - /mnt/data/wcm/data/hdr/train/hdrframes_1080p_2
    dataroot_lq:
      - /mnt/data/wcm/data/hdr/train/sdrframes_1080p
      - /mnt/data/wcm/data/hdr/train/sdrframes_1080p_2
    dataset_weights: [0.3, 0.7]
    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 512
    use_hflip: true
    use_rot: true

    batch_size_per_gpu: 48
    num_worker_per_gpu: 16
    dataset_enlarge_ratio: 1
    load_to_memory: false

  val:
    name: SDR2HDR_Val
    type: HDRPairedImageDataset
    dataroot_gt: /mnt/data/wcm/data/hdr/val/val_hdrframes_1080p
    dataroot_lq: /mnt/data/wcm/data/hdr/val/val_sdrframes_1080p
    io_backend:
      type: disk

network_g:
  type: HDRnetBT709
  num_in_ch: 3
  num_out_ch: 3
  grid_H: 32
  grid_W: 32
  grid_D: 8
  base_channels: 16
  # num_downsample: 3
  num_residual: 2
  fixed_ds_size: 512

train:
  ema: false
  ema_decay: 0.999

  optim_g:
    type: AdamW
    lr: !!float 1e-5
    weight_decay: !!float 1e-6
    betas: [0.9, 0.999]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [400000]
    restart_weights: [1.0]
    eta_min: !!float 1e-7

  total_iter: 400000
  warmup_iter: -1

  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  chroma_opt:
    type: ChromaLoss
    loss_weight: 0.1

val:
  val_freq: 5000
  save_img: true

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

logger:
  print_freq: 200
  save_checkpoint_freq: 5000
  use_tb_logger: true
  tb_logger_freq: 100

path:
  root: ./experiments
  pretrain_network_g: /mnt/data/wcm/HDRNet/experiments/train_hdrnet_bt709_sdr2hdr/models/net_g_latest.pth
  strict_load: true
  resume_state: ~

dist_params:
  backend: nccl
  port: 29500
