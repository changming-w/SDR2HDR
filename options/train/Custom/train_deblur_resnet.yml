# CMD:
# basicsr/train.py -opt /mnt/data/wcm/HDRNet/options/train/Custom/train_deblur_resnet.yml

# 顶级核心参数
name: train_deblur_resnet
model_type: Deblur6D3Model
scale: 1
num_gpu: 1
manual_seed: 0
use_amp: false  # 不启用混合精度训练
dist: false  # 单GPU训练，关闭分布式
auto_resume: true  # 不自动恢复训练
is_train: true  # 训练模式

# 数据集配置
datasets:
  train:
    name: DeblurTrainDataset
    type: PairedImageDataset
    dataroot_gt: /mnt/data/datasets/REDS/nafnet/train/train_sharp.lmdb  # 训练集HR路径
    dataroot_lq: /mnt/data/datasets/REDS/nafnet/train/n10_denoised_blur.lmdb  # 训练集LR路径
    io_backend:
      type: lmdb  # 本地磁盘加载
    gt_size: 384  # 训练patch尺寸
    scale: 1  # 超分倍数
    use_hflip: true  # 不启用水平翻转增强
    use_rot: false  # 不启用旋转增强
    num_worker_per_gpu: 8  # 数据加载线程数
    batch_size_per_gpu: 48  # 单GPU批次大小
    dataset_enlarge_ratio: 1  # 不扩充数据集
    prefetch_mode: ~  # 不启用预加载
    pin_memory: false  # 不锁定内存
    phase: train  # 训练阶段

  val:
    name: DeblurValDataset
    type: PairedImageDataset
    dataroot_gt: /mnt/data/datasets/REDS/nafnet/val/sharp_300.lmdb  # 验证集HR路径
    dataroot_lq: /mnt/data/datasets/REDS/nafnet/val/blur_300.lmdb  # 验证集LR路径
    io_backend:
      type: lmdb
    scale: 1
    cache_data: false  # 关闭缓存，避免加载隐性错误
    num_worker_per_gpu: 0  # 禁用多线程，防止验证卡死
    batch_size_per_gpu: 1  # 验证集单批次
    phase: val  # 验证阶段

# 网络配置
network_g:
  type: Deblur_ResNet_ConvDown_PS4_Split_Model  # 自定义模型类型
  in_channels: 3
  num_channels: 64

  # 三大块 block 数量
  num_low_blocks: 6    
  num_deep_blocks: 3   
  num_mid_blocks: 3    

# 路径配置（修复变量冲突，自动创建目录）
path:
  log: log
  models: models
  training_states: training_states
  pretrain_network_g: ~
  strict_load_g: false  # 非严格加载模型参数
  resume_state: ~  # 不恢复训练状态

# 训练配置
train:
  optim_g:
    type: AdamW  # 优化器
    lr: !!float 1e-4  # 初始学习率
    weight_decay: !!float 1e-4  # 权重衰减
    betas: [0.9, 0.999]  # Adam参数
    eps: !!float 1e-8  # 数值稳定性参数
  scheduler:
    type: CosineAnnealingRestartLR  # 学习率调度器
    periods: [400000]  # 学习率周期
    restart_weights: [1]  # 重启权重
    eta_min: !!float 1e-6  # 最小学习率
  total_iter: 400000  # 总迭代次数
  warmup_iter: -1  # 不启用热身学习率

  pixel_opt:
    type: L1Loss  # 像素损失函数
    loss_weight: 1.0  # 损失权重
    reduction: mean  # 损失计算方式

  grad_opt:
    type: GradientLoss
    loss_weight: 0.02
    mode: l1

  perceptual_opt:
    type: PerceptualLoss
    # VGG 每一层的权重，可按需调整
    layer_weights:
      relu2_2: 0.5
      relu3_3: 1.0
    vgg_type: vgg19
    perceptual_weight: 0.02   # 整体感知 loss 的权重
    style_weight: 0.0        # 一般做复原先不加 style，可保持 0
    criterion: l1  


  gradient_clip: 0.01  # 梯度裁剪阈值



# 验证配置（确保图片保存）
val:
  val_freq: 5000  # 每1000次迭代验证一次
  save_img: true  # 强制保存验证图片
  img_format: 'png'  # 图片格式
  pad_to_multiples: 4  # 补边到4的倍数
  padding_mode: 'reflect'  # 补边模式
  metrics:
    psnr:
      type: calculate_psnr  # 计算PSNR
      crop_border: 2  # 裁剪边界像素
      test_y_channel: false  # 不使用Y通道计算
    ssim:
      type: calculate_ssim  # 计算SSIM
      crop_border: 2
      test_y_channel: false

# 日志配置
logger:
  print_freq: 500  # 每100次迭代打印一次日志
  save_checkpoint_freq: 5000  # 每5000次迭代保存一次模型
  use_tb_logger: true  # 使用TensorBoard
  tb_logger_freq: 500  # TensorBoard日志频率
  wandb:
    project: ~  # 不使用WandB
    resume_id: ~

# 分布式配置（单GPU无需修改）
dist_params:
  backend: nccl
  port: 29500

# 其他配置
find_unused_parameters: false  # 不查找未使用参数
use_deterministic_algorithms: false  # 不使用确定性算法