name: test_hdrnet_bt709_sdr2hdr_datacast_400_0920
model_type: SRModel
scale: 1  
num_gpu: 0
manual_seed: 12

datasets:
  val:
    name: SDR2HDR_Test
    type: SingleImageDataset
    dataroot_lq: /mnt/data/wcm/data/hdr/train/Q10M采集400张/dump_sdr_vb1_1080p
    filename_tmpl: '{}'
    io_backend:
      type: disk

network_g:
  type: HDRnetBT709Paper
  num_in_ch: 3
  num_out_ch: 3
  grid_H: 16
  grid_W: 16
  grid_D: 8
  base_channels: 1
  fixed_ds_size: 256
  global_channels: 64

val:
  val_freq: 1
  suffix: ~
  save_img: true

logger:
  print_freq: 1
  save_checkpoint_freq: 999999
  use_tb_logger: false
  tb_logger_freq: 100

path:
  root: ./experiments
  pretrain_network_g: ./experiments/train_hdrnet_bt709_sdr2hdr_datacast_400_0916/models/net_g_95000.pth
  strict_load: true
  resume_state: ~

dist_params:
  backend: nccl
  port: 29500
