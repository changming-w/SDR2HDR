name: train_hdrnet_1dlut_test
model_type: SRModel
scale: 1
num_gpu: 1
manual_seed: 1234
dist: false

datasets:
  test_1:
    name: HDRTestSet
    type: SingleImageDataset
    dataroot_lq: /mnt/data/wcm/data/test_jiali
    io_backend:
      type: disk

network_g:
  type: HDRnet1DLUT
  num_in_ch: 3
  num_out_ch: 3
  num_bins: 4096
  base_channels: 16
  num_downsample: 4
  fixed_ds_size: 512

inference:
  hdrnet_strength: 1.0

path:
  pretrain_network_g: /mnt/data/wcm/HDRNet/experiments/train_hdrnet_1dlut/train_hdrnet_1dlut/models/net_g_latest.pth
  strict_load_g: true

val:
  save_img: true
  pbar: true
  suffix: _1dlut_20000

  metrics: {}
